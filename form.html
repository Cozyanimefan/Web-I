<!DOCTYPE html>
<html>
<head>
    <title>Nested Table Example</title>
</head>
<form>
<label for="First name">First name</label>
<input id="First name" type="text" placeholder="Enter your first name"></input><br>
<label for="Last name">Last name</label>
<input id="Last name" type="text" placeholder="Enter your Last name"></input><br>
<label for="email">Email</label>
<input id="email" type="email" placeholder="Enter your email"></input><br>
<label for="pass">Password</label>
<input id="pass" type="password"></input><br>
<label for="gender">Gender: </label>
<input type="radio" value="male" name="gender"> Male 
<input  type="radio" value="Female" name="gender"> Female
<input type="radio" value="other" name="gender"> Other
</form><br>
Nationality:<br>
<select>
<option> Nepali</option>
<option selected> Japanese</option>
<option> korean</option>
</select><br>
Date: 
<input type="datetime-local">
<h3>Select your hobbies:</h3>

    <input type="checkbox" id="anime" name="hobby" value="anime">
    <label for="anime">Anime</label><br>

    <input type="checkbox" id="reading" name="hobby" value="Reading">
    <label for="reading">Reading</label><br>

    <input type="checkbox" id="gaming" name="hobby" value="Gaming">
    <label for="gaming">Gaming</label><br>

    <input type="checkbox" id="music" name="hobby" value="Music">
    <label for="music">Music</label><br>

<textarea placeholder="Enter about yourself"></textarea><br>
<button onclick="submit">Submit</button>
<input type="reset" value="reset"></input>
</body>
</html>
